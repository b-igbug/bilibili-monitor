name: bilibili-monitor

# 每 5 分钟运行一次（GitHub 免费仓库最低间隔 5 分钟）
# 也支持在 Actions 页面手动触发一次（workflow_dispatch）
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行监控脚本（抓B站动态 -> 有新动态推送飞书）
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python monitor.py
      - name: 提交更新后的状态
        run: |
          git config user.name "bilibili-monitor"
          git config user.email "actions@github.com"
          git add state.json
          git commit -m "chore: 更新监控状态 $(date -u +%Y%m%d%H%M%S)" || echo "状态无变化，无需提交"
          git push
